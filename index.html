<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PENGUIN PARTY - KARLI KASABA</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐧</text></svg>">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Fredoka+One&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Fredoka One', cursive, sans-serif;
            background-color: #bde0fe;
        }

        #game-container {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
        }

        #start-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle, rgba(200, 240, 255, 0.88) 0%, rgba(130, 205, 245, 0.94) 100%);
            backdrop-filter: blur(6px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            transition: opacity 0.4s ease, visibility 0.4s;
        }

        #start-screen.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .menu-card {
            background: #ffffff;
            padding: 40px 55px;
            border-radius: 45px;
            border: 8px solid #a2d2ff;
            box-shadow: 0 20px 0 rgba(142, 202, 230, 0.5), 0 30px 50px rgba(0, 0, 0, 0.2);
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            max-width: 440px;
            width: 90%;
        }

        .game-logo {
            font-family: 'Luckiest Guy', cursive, sans-serif;
            font-size: 50px;
            color: #0077b6;
            text-shadow: 4px 4px 0 #90e0ef, 8px 8px 0 #caf0f8;
            letter-spacing: 3px;
            margin-bottom: 20px;
            transform: rotate(-3deg);
            text-align: center;
        }

        .nickname-input {
            font-family: 'Fredoka One', cursive, sans-serif;
            font-size: 19px;
            text-align: center;
            color: #03045e;
            background: #f0f9ff;
            border: 4px solid #bde0fe;
            border-radius: 25px;
            padding: 10px 18px;
            width: 100%;
            outline: none;
            margin-bottom: 18px;
        }

        .play-btn {
            font-family: 'Luckiest Guy', cursive, sans-serif;
            font-size: 30px;
            letter-spacing: 2px;
            color: #ffffff;
            background: linear-gradient(180deg, #00b4d8 0%, #0077b6 100%);
            border: 5px solid #ffffff;
            border-radius: 36px;
            padding: 12px 60px;
            cursor: pointer;
            box-shadow: 0 10px 0 #023e8a;
            transition: transform 0.1s ease;
        }

        .play-btn:active {
            transform: translateY(6px);
            box-shadow: 0 4px 0 #023e8a;
        }

        #hud-top {
            position: absolute;
            top: 18px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            pointer-events: none;
            z-index: 10;
        }

        .arcade-card {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 22px;
            border-radius: 26px;
            background: rgba(255, 255, 255, 0.92);
            border: 4px solid #bde0fe;
            box-shadow: 0 8px 0 rgba(0, 119, 182, 0.2);
        }

        .card-info {
            display: flex;
            flex-direction: column;
        }

        .card-info .label {
            font-size: 11px;
            letter-spacing: 1.5px;
            color: #0077b6;
            font-weight: 900;
        }

        .card-info .value {
            font-size: 24px;
            font-weight: 800;
        }

        #score { color: #023e8a; }
        #ammo { color: #0096c7; }

        #leaderboard-panel {
            background: rgba(255, 255, 255, 0.92);
            border: 4px solid #bde0fe;
            border-radius: 24px;
            padding: 12px 18px;
            box-shadow: 0 8px 0 rgba(0, 119, 182, 0.2);
            min-width: 210px;
            pointer-events: none;
        }

        .lb-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px dashed #bde0fe;
            padding-bottom: 6px;
            margin-bottom: 8px;
        }

        .lb-title {
            font-family: 'Luckiest Guy', cursive;
            font-size: 16px;
            color: #0077b6;
            letter-spacing: 1px;
        }

        .lb-online {
            font-size: 12px;
            color: #06d6a0;
            font-weight: 900;
        }

        .lb-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 4px;
            font-size: 13px;
        }

        .lb-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #03045e;
        }

        .lb-row.me {
            font-weight: 900;
            color: #d90429;
        }

        .arcade-pill {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.92);
            padding: 10px 24px;
            border-radius: 40px;
            border: 3px solid #90e0ef;
            box-shadow: 0 6px 0 rgba(0, 119, 182, 0.2);
            font-size: 14px;
            color: #03045e;
            pointer-events: none;
            z-index: 10;
            white-space: nowrap;
        }

        .arcade-pill b { color: #0077b6; }
    </style>
</head>
<body>
    <div id="game-container"></div>

    <div id="start-screen">
        <div class="menu-card">
            <h1 class="game-logo">PENGUIN<br>PARTY!</h1>
            <input id="nickname-input" class="nickname-input" type="text" placeholder="Penguen İsmini Yaz..." maxlength="12" autofocus />
            <button id="start-button" class="play-btn">OYUNA KATIL!</button>
        </div>
    </div>

    <div id="hud-top">
        <div style="display: flex; gap: 14px;">
            <div class="arcade-card">
                <span style="font-size: 30px;">⭐</span>
                <div class="card-info">
                    <span class="label">SKOR</span>
                    <span id="score" class="value">0</span>
                </div>
            </div>

            <div class="arcade-card">
                <span style="font-size: 30px;">🪙</span>
                <div class="card-info">
                    <span class="label">ALTIN & ENVANTER</span>
                    <span id="ammo" class="value">🪙 0 | 🐟 x0 Balık</span>
                </div>
            </div>
        </div>

        <div id="leaderboard-panel">
            <div class="lb-header">
                <span class="lb-title">🏆 LİDERLER</span>
                <span id="online-indicator" class="lb-online">🟢 1</span>
            </div>
            <ul id="leaderboard-list" class="lb-list">
                <li class="lb-row me"><span>1. Sen</span><span>0</span></li>
            </ul>
        </div>
    </div>

    <div id="controls-hint" class="arcade-pill">
        🏡 <b>W/S:</b> Koş | <b>Shift:</b> Kay | <b>E / Tık:</b> Omuz At | <b>Space:</b> Balık Fırlat
    </div>
