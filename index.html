<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PENGUIN PARTY - KARLI KASABA</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐧</text></svg>">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Fredoka+One&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Fredoka One', cursive, sans-serif;
            background-color: #bde0fe;
        }

        #game-container {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
        }

        #start-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle, rgba(200, 240, 255, 0.90) 0%, rgba(130, 205, 245, 0.96) 100%);
            backdrop-filter: blur(6px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            transition: opacity 0.4s ease, visibility 0.4s;
        }

        #start-screen.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .menu-card {
            background: #ffffff;
            padding: 40px 55px;
            border-radius: 45px;
            border: 8px solid #a2d2ff;
            box-shadow: 0 20px 0 rgba(142, 202, 230, 0.5), 0 30px 50px rgba(0, 0, 0, 0.2);
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            max-width: 440px;
            width: 90%;
        }

        .game-logo {
            font-family: 'Luckiest Guy', cursive, sans-serif;
            font-size: 52px;
            color: #0077b6;
            text-shadow: 4px 4px 0 #90e0ef, 8px 8px 0 #caf0f8;
            letter-spacing: 3px;
            margin-bottom: 20px;
            transform: rotate(-3deg);
            text-align: center;
        }

        .nickname-input {
            font-family: 'Fredoka One', cursive, sans-serif;
            font-size: 19px;
            text-align: center;
            color: #03045e;
            background: #f0f9ff;
            border: 4px solid #bde0fe;
            border-radius: 25px;
            padding: 10px 18px;
            width: 100%;
            outline: none;
            margin-bottom: 18px;
        }

        .play-btn {
            font-family: 'Luckiest Guy', cursive, sans-serif;
            font-size: 30px;
            letter-spacing: 2px;
            color: #ffffff;
            background: linear-gradient(180deg, #00b4d8 0%, #0077b6 100%);
            border: 5px solid #ffffff;
            border-radius: 36px;
            padding: 12px 60px;
            cursor: pointer;
            box-shadow: 0 10px 0 #023e8a;
            transition: transform 0.1s ease;
        }

        .play-btn:active {
            transform: translateY(6px);
            box-shadow: 0 4px 0 #023e8a;
        }

        #hud-top {
            position: absolute;
            top: 18px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            pointer-events: none;
            z-index: 10;
        }

        .arcade-card {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 22px;
            border-radius: 26px;
            background: rgba(255, 255, 255, 0.94);
            border: 4px solid #bde0fe;
            box-shadow: 0 8px 0 rgba(0, 119, 182, 0.2);
        }

        .card-info {
            display: flex;
            flex-direction: column;
        }

        .card-info .label {
            font-size: 11px;
            letter-spacing: 1.5px;
            color: #0077b6;
            font-weight: 900;
        }

        .card-info .value {
            font-size: 24px;
            font-weight: 800;
        }

        #score { color: #023e8a; }
        #ammo { color: #0096c7; }

        #leaderboard-panel {
            background: rgba(255, 255, 255, 0.94);
            border: 4px solid #bde0fe;
            border-radius: 24px;
            padding: 12px 18px;
            box-shadow: 0 8px 0 rgba(0, 119, 182, 0.2);
            min-width: 210px;
            pointer-events: none;
        }

        .lb-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px dashed #bde0fe;
            padding-bottom: 6px;
            margin-bottom: 8px;
        }

        .lb-title {
            font-family: 'Luckiest Guy', cursive;
            font-size: 16px;
            color: #0077b6;
            letter-spacing: 1px;
        }

        .lb-online {
            font-size: 12px;
            color: #06d6a0;
            font-weight: 900;
        }

        .lb-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 4px;
            font-size: 13px;
        }

        .lb-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #03045e;
        }

        .lb-row.me {
            font-weight: 900;
            color: #d90429;
        }

        .arcade-pill {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.92);
            padding: 10px 24px;
            border-radius: 40px;
            border: 3px solid #90e0ef;
            box-shadow: 0 6px 0 rgba(0, 119, 182, 0.2);
            font-size: 14px;
            color: #03045e;
            pointer-events: none;
            z-index: 10;
            white-space: nowrap;
        }

        .arcade-pill b { color: #0077b6; }
    </style>
</head>
<body>
    <div id="game-container"></div>

    <div id="start-screen">
        <div class="menu-card">
            <h1 class="game-logo">PENGUIN<br>PARTY!</h1>
            <input id="nickname-input" class="nickname-input" type="text" placeholder="Penguen İsmini Yaz..." maxlength="12" autofocus />
            <button id="start-button" class="play-btn">KASABAYA GİR!</button>
        </div>
    </div>

    <div id="hud-top">
        <div style="display: flex; gap: 14px;">
            <div class="arcade-card">
                <span style="font-size: 30px;">⭐</span>
                <div class="card-info">
                    <span class="label">SKOR</span>
                    <span id="score" class="value">0</span>
                </div>
            </div>

            <div class="arcade-card">
                <span style="font-size: 30px;">🪙</span>
                <div class="card-info">
                    <span class="label">ALTIN & ENVANTER</span>
                    <span id="ammo" class="value">🪙 0 | 🐟 x0 Balık</span>
                </div>
            </div>
        </div>

        <div id="leaderboard-panel">
            <div class="lb-header">
                <span class="lb-title">🏆 LİDERLER</span>
                <span id="online-indicator" class="lb-online">🟢 1</span>
            </div>
            <ul id="leaderboard-list" class="lb-list">
                <li class="lb-row me"><span>1. Sen</span><span>0</span></li>
            </ul>
        </div>
    </div>

    <div id="controls-hint" class="arcade-pill">
        🐧 <b>W/S:</b> Yürü | <b>Shift:</b> Kay | <b>E / Tık:</b> Vuruş | <b>Space:</b> Balık Fırlat
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="/socket.io/socket.io.js"></script>

    <script>
        const container = document.getElementById("game-container");
        const scoreEl = document.getElementById("score");
        const ammoEl = document.getElementById("ammo");
        const startScreen = document.getElementById("start-screen");
        const startBtn = document.getElementById("start-button");
        const nicknameInput = document.getElementById("nickname-input");
        const lbList = document.getElementById("leaderboard-list");
        const onlineIndicator = document.getElementById("online-indicator");

        let isGameStarted = false;
        let myUsername = "Penguen";

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xbfe3f7);
        scene.fog = new THREE.FogExp2(0xbfe3f7, 0.0035);

        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.85);
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xfffaed, 1.4);
        sunLight.position.set(90, 80, 80);
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.width = 2048;
        sunLight.shadow.mapSize.height = 2048;
        sunLight.shadow.bias = -0.0004;
        scene.add(sunLight);

        const arenaSize = 280;
        const arenaLimit = arenaSize / 2 - 10;

        const snowMat = new THREE.MeshStandardMaterial({ color: 0xf4f9fc, roughness: 0.9 });
        const snowFloor = new THREE.Mesh(new THREE.PlaneGeometry(arenaSize, arenaSize), snowMat);
        snowFloor.rotation.x = -Math.PI / 2;
        snowFloor.receiveShadow = true;
        scene.add(snowFloor);

        const pondRadius = 42;
        const icePond = new THREE.Mesh(
            new THREE.CircleGeometry(pondRadius, 64),
            new THREE.MeshStandardMaterial({ color: 0x72ddf7, roughness: 0.08, transparent: true, opacity: 0.92 })
        );
        icePond.rotation.x = -Math.PI / 2;
        icePond.position.y = 0.02;
        icePond.receiveShadow = true;
        scene.add(icePond);

        const hillRamps = [
            { x: -55, z: 45, radiusX: 32, radiusZ: 26, height: 10.5, rot: 0.35 },
            { x: 58, z: -48, radiusX: 30, radiusZ: 34, height: 11.2, rot: -0.5 },
            { x: 48, z: 58, radiusX: 28, radiusZ: 28, height: 9.6, rot: 1.0 },
            { x: -62, z: -55, radiusX: 34, radiusZ: 30, height: 10.0, rot: -1.1 }
        ];

        const hillMat = new THREE.MeshStandardMaterial({ color: 0xe2f1f8, roughness: 0.45, flatShading: true });
        hillRamps.forEach((h) => {
            const hillGeo = new THREE.ConeGeometry(1, h.height, 16, 5);
            hillGeo.translate(0, h.height / 2, 0);
            const hillMesh = new THREE.Mesh(hillGeo, hillMat);
            hillMesh.scale.set(h.radiusX, 1, h.radiusZ);
            hillMesh.rotation.y = h.rot;
            hillMesh.position.set(h.x, 0, h.z);
            hillMesh.castShadow = true;
            hillMesh.receiveShadow = true;
            scene.add(hillMesh);
        });

        function getTerrainElevation(x, z) {
            let height = 0;
            let onHill = false;
            for (let h of hillRamps) {
                const cosR = Math.cos(-h.rot);
                const sinR = Math.sin(-h.rot);
                const dx = x - h.x;
                const dz = z - h.z;
                const distNorm = Math.hypot((dx * cosR - dz * sinR) / h.radiusX, (dx * sinR + dz * cosR) / h.radiusZ);
                if (distNorm < 1.0) {
                    const hVal = (1.0 - distNorm) * h.height;
                    if (hVal > height) { height = hVal; onHill = true; }
                }
            }
            return { height, onHill };
        }

        const gltfLoader = new THREE.GLTFLoader();
        let loadedPenguinBase = null;
        let mixer = null;

        const playerGroup = new THREE.Group();
        scene.add(playerGroup);

        const footShadow = new THREE.Mesh(
            new THREE.CircleGeometry(1.1, 24),
            new THREE.MeshBasicMaterial({ color: 0x0077b6, transparent: true, opacity: 0.35 })
        );
        footShadow.rotation.x = -Math.PI / 2;
        footShadow.position.y = 0.02;
        playerGroup.add(footShadow);

        gltfLoader.load(
            '/models/penguin.glb',
            (gltf) => {
                loadedPenguinBase = gltf.scene;
                loadedPenguinBase.scale.set(1.5, 1.5, 1.5);
                loadedPenguinBase.traverse((child) => {
                    if (child.isMesh) {
                        child.castShadow = true;
                        child.receiveShadow = true;
                    }
                });

                const myPenguinMesh = loadedPenguinBase.clone();
                playerGroup.add(myPenguinMesh);

                if (gltf.animations && gltf.animations.length > 0) {
                    mixer = new THREE.AnimationMixer(myPenguinMesh);
                    const action = mixer.clipAction(gltf.animations[0]);
                    action.play();
                }

                bots.forEach(b => {
                    b.group.add(loadedPenguinBase.clone());
                });
            },
            undefined,
            (error) => {
                console.warn("penguin.glb yüklenirken kontrol edin:", error);
            }
        );

        function createNameTag(name) {
            const canvas = document.createElement("canvas");
            canvas.width = 256; canvas.height = 64;
            const ctx = canvas.getContext("2d");
            ctx.fillStyle = "rgba(2, 62, 138, 0.85)";
            if (ctx.roundRect) ctx.roundRect(8, 8, 240, 48, 14); else ctx.rect(8, 8, 240, 48);
            ctx.fill();
            ctx.font = "bold 26px 'Fredoka One', sans-serif";
            ctx.fillStyle = "#ffffff"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
            ctx.fillText(name, 128, 32);

            const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(canvas), depthTest: false }));
            sprite.scale.set(3.4, 0.85, 1);
            sprite.position.set(0, 3.4, 0);
            return sprite;
        }

        let bots = [];
        const botNames = ["Buzlu", "Piko", "Fındık", "Kar_Topu", "Paytak"];
        for (let i = 0; i < 5; i++) {
            const bGroup = new THREE.Group();
            bGroup.add(footShadow.clone());
            bGroup.add(createNameTag(botNames[i]));
            const ang = (i / 5) * Math.PI * 2;
            bGroup.position.set(Math.cos(ang) * 20, 0, Math.sin(ang) * 20);
            scene.add(bGroup);

            bots.push({
                group: bGroup,
                name: botNames[i],
                score: 0,
                angle: Math.random() * Math.PI * 2,
                speed: 0.08
            });
        }

        const socket = io();
        const otherPlayers = {};

        socket.on("currentPlayers", (players) => {
            Object.keys(players).forEach(id => {
                if (id !== socket.id && !otherPlayers[id]) {
                    const pGroup = new THREE.Group();
                    pGroup.add(footShadow.clone());
                    pGroup.add(createNameTag(players[id].username || "Penguen"));
                    if (loadedPenguinBase) pGroup.add(loadedPenguinBase.clone());
                    scene.add(pGroup);
                    otherPlayers[id] = { group: pGroup, targetPos: new THREE.Vector3(), targetRot: 0 };
                }
            });
        });

        socket.on("playerMoved", (info) => {
            if (otherPlayers[info.id]) {
                otherPlayers[info.id].targetPos.set(info.x, info.y || 0, info.z);
                otherPlayers[info.id].targetRot = info.rotation;
            }
        });

        function handleStartGame() {
            const val = nicknameInput.value.trim();
            myUsername = val !== "" ? val : "Penguen_" + Math.floor(Math.random() * 900 + 100);
            startScreen.classList.add("hidden");
            isGameStarted = true;
            playerGroup.add(createNameTag(myUsername));
            socket.emit("joinGame", { username: myUsername });
        }

        startBtn.addEventListener("click", handleStartGame);
        nicknameInput.addEventListener("keydown", (e) => { if (e.key === "Enter") handleStartGame(); });

        let keys = {};
        let pAngle = 0;
        let walkCycle = 0;

        window.addEventListener("keydown", (e) => { keys[e.key.toLowerCase()] = true; });
        window.addEventListener("keyup", (e) => { keys[e.key.toLowerCase()] = false; });

        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();

            if (mixer) mixer.update(delta);

            let forward = 0;
            let turn = 0;

            if (isGameStarted) {
                if (keys["w"] || keys["arrowup"]) forward += 1;
                if (keys["s"] || keys["arrowdown"]) forward -= 0.6;
                if (keys["a"] || keys["arrowleft"]) turn += 1;
                if (keys["d"] || keys["arrowright"]) turn -= 1;
            }

            pAngle += turn * 0.04;
            playerGroup.rotation.y = pAngle;

            const isMoving = Math.abs(forward) > 0.01;
            const currentSpeed = (keys["shift"] ? 0.6 : 0.35) * forward;

            playerGroup.position.x -= Math.sin(pAngle) * currentSpeed;
            playerGroup.position.z -= Math.cos(pAngle) * currentSpeed;

            const elev = getTerrainElevation(playerGroup.position.x, playerGroup.position.z);
            playerGroup.position.y = THREE.MathUtils.lerp(playerGroup.position.y, elev.height, 0.3);

            if (isMoving) {
                walkCycle += 0.22;
                playerGroup.rotation.z = Math.sin(walkCycle) * 0.12;
            } else {
                playerGroup.rotation.z = 0;
            }

            if (isGameStarted && isMoving) {
                socket.emit("playerMovement", {
                    x: playerGroup.position.x,
                    y: playerGroup.position.y,
                    z: playerGroup.position.z,
                    rotation: pAngle
                });
            }

            const camDist = 11;
            const camHeight = 5.2;
            camera.position.x = THREE.MathUtils.lerp(camera.position.x, playerGroup.position.x + Math.sin(pAngle) * camDist, 0.08);
            camera.position.y = THREE.MathUtils.lerp(camera.position.y, playerGroup.position.y + camHeight, 0.1);
            camera.position.z = THREE.MathUtils.lerp(camera.position.z, playerGroup.position.z + Math.cos(pAngle) * camDist, 0.08);
            camera.lookAt(playerGroup.position.x, playerGroup.position.y + 1.2, playerGroup.position.z);

            renderer.render(scene, camera);
        }

        window.addEventListener("resize", () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
